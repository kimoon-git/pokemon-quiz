<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 이름 맞추기 퀴즈</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .score-board { font-size: 1.2rem; font-weight: bold; color: #333; }
    .timer-board { font-size: 1.2rem; font-weight: bold; color: #ff5350; }
    .img-box {
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .img-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.opt-btn {
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.opt-btn:active { transform: scale(0.97); background: #f0f0f0; }
    button.opt-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { height: 28px; margin: 16px 0; font-weight: bold; font-size: 1.1rem; }
    .next-btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background-color: #ff5350;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .loading { font-size: 1.1rem; color: #666; }

    /* 카카오톡 안내 레이어 팝업 */
    #kakaotalk-notice {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #ffeb3b;
      z-index: 99999;
      color: #3c1e1e;
      text-align: center;
      padding: 40px 20px;
    }
    #kakaotalk-notice .arrow {
      position: absolute;
      top: 10px;
      right: 25px;
      font-size: 36px;
      animation: bounce 0.8s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }
    #kakaotalk-notice h2 { font-size: 1.5rem; margin-top: 40px; margin-bottom: 15px; }
    #kakaotalk-notice p { font-size: 1.1rem; line-height: 1.6; word-break: keep-all; font-weight: 600; }
    #kakaotalk-notice .sub-text { font-size: 0.95rem; color: #666; margin-top: 25px; font-weight: normal; }
  </style>
</head>
<body>

<!-- 카카오톡 브라우저 우회 안내 레이어 팝업 -->
<div id="kakaotalk-notice">
  <div class="arrow">↗️</div>
  <h2>크롬/사파리로 열어주세요!</h2>
  <p>카카오톡 내부 화면에서는<br><b>음성 및 사운드가 지원되지 않습니다.</b></p>
  <p class="sub-text">
    우측 상단 <b>[⋮]</b> 또는 <b>[줄 3개]</b> 버튼을 누른 후<br>
    <b>'다른 브라우저로 열기'</b>를 선택하시면<br>정상적으로 게임을 즐기실 수 있습니다!
  </p>
</div>

<div class="card">
  <div class="top-bar">
    <div class="score-board">점수: <span id="score">0</span>점</div>
    <div class="timer-board">⏳ <span id="timer">10</span>초</div>
  </div>
  
  <div class="img-box">
    <div id="loading" class="loading">포켓몬 불러오는 중...</div>
    <img id="pokemon-img" style="display:none;" alt="포켓몬">
  </div>

  <div class="options-grid" id="options"></div>
  <div class="msg" id="message"></div>
  
  <button class="next-btn" id="next-btn" onclick="loadQuiz()" style="display:none;">다음 문제</button>
</div>

<script>
  // ------------------------------------------------------------------
  // 🚨 카카오톡 인앱 브라우저 감지 및 전체 화면 안내
  // ------------------------------------------------------------------
  (function checkInAppBrowser() {
    const userAgent = navigator.userAgent.toLowerCase();
    if (userAgent.indexOf('kakaotalk') > -1) {
      document.addEventListener('DOMContentLoaded', () => {
        const notice = document.getElementById('kakaotalk-notice');
        if (notice) notice.style.display = 'block';
      });
    }
  })();

  // ------------------------------------------------------------------
  // 🎮 게임 변수
  // ------------------------------------------------------------------
  let score = 0;
  let currentAnswer = "";
  let timerInterval = null;
  let timeLeft = 10;
  let audioCtx = null;
  let isQuizLoading = false; // 중복 호출 방지 플래그

  const MAX_POKEMON_ID = 802;

  function getAudioContext() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    } catch(e) {
      return null;
    }
  }

  // TTS 음성 출력
  function speakText(text, callback) {
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.0;
        
        let called = false;
        const safeCallback = () => {
          if (!called && callback) {
            called = true;
            callback();
          }
        };

        utterance.onend = safeCallback;
        utterance.onerror = safeCallback;

        window.speechSynthesis.speak(utterance);

        // TTS 응답 없을 때를 대비한 타임아웃
        setTimeout(safeCallback, 2000);
      } else if (callback) {
        callback();
      }
    } catch(e) {
      if (callback) callback();
    }
  }

  // 타이머 소리
  function playTickSound() {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.05);
    } catch(e) {}
  }

  // 정답 환호성
  function playCheerSound() {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      
      notes.forEach((freq, index) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.1 + 0.3);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime + index * 0.1);
        osc.stop(ctx.currentTime + index * 0.1 + 0.3);
      });
    } catch(e) {}
  }

  async function getPokemonData(id) {
    const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
    if (!res.ok) throw new Error("네트워크 오류");
    const data = await res.json();
    const nameEntry = data.names.find(n => n.language.name === 'ko');
    
    return {
      id: id,
      name: nameEntry ? nameEntry.name : "알수없음",
      img: imgUrl
    };
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 10;
    document.getElementById('timer').innerText = timeLeft;

    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft;
      
      if (timeLeft > 0) {
        playTickSound();
      } else {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  // 💡 문제 로딩 함수 (중복 호출 및 8지선다 버그 완벽 수정)
  async function loadQuiz() {
    if (isQuizLoading) return; // 이미 로딩 중이면 중복 실행 방지
    isQuizLoading = true;

    stopTimer();
    try { window.speechSynthesis.cancel(); } catch(e) {}

    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = ''; // 기존 버튼 즉시 초기화

    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').innerText = "포켓몬 불러오는 중...";
    document.getElementById('pokemon-img').style.display = 'none';
    document.getElementById('message').innerText = '';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('timer').innerText = "10";

    const randomIds = [];
    while (randomIds.length < 4) {
      const rand = Math.floor(Math.random() * MAX_POKEMON_ID) + 1;
      if (!randomIds.includes(rand)) randomIds.push(rand);
    }

    try {
      const pokemons = [];
      for (const id of randomIds) {
        const p = await getPokemonData(id);
        pokemons.push(p);
      }
      
      const target = pokemons[0];
      currentAnswer = target.name;

      const imgElem = document.getElementById('pokemon-img');
      imgElem.src = target.img;
      
      imgElem.onload = () => {
        document.getElementById('loading').style.display = 'none';
        imgElem.style.display = 'block';

        speakText("다음 포켓몬의 이름은 뭘까요?");
        startTimer();
        isQuizLoading = false; // 로딩 완료
      };

      imgElem.onerror = () => {
        isQuizLoading = false;
        setTimeout(loadQuiz, 500);
      };

      const shuffledOptions = [...pokemons].sort(() => Math.random() - 0.5);
      
      optionsContainer.innerHTML = ''; // 생성 직전 2차 초기화
      shuffledOptions.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = p.name;
        btn.onclick = () => checkAnswer(p.name);
        optionsContainer.appendChild(btn);
      });

    } catch (err) {
      isQuizLoading = false;
      document.getElementById('loading').innerText = "다시 시도 중...";
      setTimeout(loadQuiz, 1000);
    }
  }

  function checkAnswer(selectedName) {
    stopTimer();
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    const msgElem = document.getElementById('message');

    if (selectedName === currentAnswer) {
      score += 10;
      document.getElementById('score').innerText = score;
      msgElem.style.color = '#2e7d32';
      msgElem.innerText = "정답입니다! 역시 둥둥지군! 🎉";
      
      playCheerSound();
      speakText("정답입니다! 역시 둥둥지군!", () => {
        setTimeout(loadQuiz, 800);
      });
    } else {
      msgElem.style.color = '#c62828';
      msgElem.innerText = `아니! 둥둥지도 모르다니! (정답: ${currentAnswer})`;
      
      speakText(`아쉬워요! 정답은 ${currentAnswer}입니다.`);
      document.getElementById('next-btn').style.display = 'block';
    }
  }

  function handleTimeout() {
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    const msgElem = document.getElementById('message');
    msgElem.style.color = '#c62828';
    msgElem.innerText = `시간 초과! (정답: ${currentAnswer})`;

    speakText(`시간이 초과되었습니다. 정답은 ${currentAnswer}입니다.`);
    document.getElementById('next-btn').style.display = 'block';
  }

  document.addEventListener('touchstart', function initAudio() {
    getAudioContext();
    document.removeEventListener('touchstart', initAudio);
  }, { once: true });

  document.addEventListener('click', function initAudio() {
    getAudioContext();
    document.removeEventListener('click', initAudio);
  }, { once: true });

  loadQuiz();
</script>
</body>
</html>
