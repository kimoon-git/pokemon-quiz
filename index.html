<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 이름 맞추기 퀴즈</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .score-board { font-size: 1.2rem; font-weight: bold; color: #333; }
    .timer-board { font-size: 1.2rem; font-weight: bold; color: #ff5350; }
    .img-box {
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .img-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.opt-btn {
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.opt-btn:active { transform: scale(0.97); background: #f0f0f0; }
    button.opt-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { height: 28px; margin: 16px 0; font-weight: bold; font-size: 1.1rem; }
    .next-btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background-color: #ff5350;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .loading { font-size: 1.1rem; color: #666; }
  </style>
</head>
<body>

<div class="card">
  <div class="top-bar">
    <div class="score-board">점수: <span id="score">0</span>점</div>
    <div class="timer-board">⏳ <span id="timer">10</span>초</div>
  </div>
  
  <div class="img-box">
    <div id="loading" class="loading">포켓몬 불러오는 중...</div>
    <img id="pokemon-img" style="display:none;" alt="포켓몬">
  </div>

  <div class="options-grid" id="options"></div>
  <div class="msg" id="message"></div>
  
  <button class="next-btn" id="next-btn" onclick="loadQuiz()" style="display:none;">다음 문제</button>
</div>

<script>
  let score = 0;
  let currentAnswer = "";
  let timerInterval = null;
  let timeLeft = 10;
  let audioCtx = null;

  // 7세대(썬&문) 전국대도감 기준 802마리
  const MAX_POKEMON_ID = 802;

  function getAudioContext() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    } catch(e) {
      return null;
    }
  }

  // 안전한 음성 출력 (카카오톡 에러 방지)
  function speakText(text, callback) {
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.0;
        if (callback) utterance.onend = callback;
        window.speechSynthesis.speak(utterance);
      } else if (callback) {
        callback();
      }
    } catch(e) {
      if (callback) callback();
    }
  }

  // 시계 소리
  function playTickSound() {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.05);
    } catch(e) {}
  }

  // 환호성 소리
  function playCheerSound() {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      
      notes.forEach((freq, index) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.1 + 0.3);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime + index * 0.1);
        osc.stop(ctx.currentTime + index * 0.1 + 0.3);
      });
    } catch(e) {}
  }

  // 카카오톡 웹뷰 호환 API 호출 함수
  async function getPokemonData(id) {
    const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
    if (!res.ok) throw new Error("네트워크 오류");
    const data = await res.json();
    const nameEntry = data.names.find(n => n.language.name === 'ko');
    
    return {
      id: id,
      name: nameEntry ? nameEntry.name : "알수없음",
      img: imgUrl
    };
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 10;
    document.getElementById('timer').innerText = timeLeft;

    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft;
      
      if (timeLeft > 0) {
        playTickSound();
      } else {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  async function loadQuiz() {
    stopTimer();
    try { window.speechSynthesis.cancel(); } catch(e) {}

    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').innerText = "포켓몬 불러오는 중...";
    document.getElementById('pokemon-img').style.display = 'none';
    document.getElementById('options').innerHTML = '';
    document.getElementById('message').innerText = '';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('timer').innerText = "10";

    const randomIds = [];
    while (randomIds.length < 4) {
      const rand = Math.floor(Math.random() * MAX_POKEMON_ID) + 1;
      if (!randomIds.includes(rand)) randomIds.push(rand);
    }

    try {
      // 카카오톡 환경 안정성을 위한 순차 로딩 방식
      const pokemons = [];
      for (const id of randomIds) {
        const p = await getPokemonData(id);
        pokemons.push(p);
      }
      
      const target = pokemons[0];
      currentAnswer = target.name;

      const imgElem = document.getElementById('pokemon-img');
      imgElem.src = target.img;
      
      imgElem.onload = () => {
        document.getElementById('loading').style.display = 'none';
        imgElem.style.display = 'block';

        speakText("다음 포켓몬의 이름은 뭘까요?");
        startTimer();
      };

      imgElem.onerror = () => {
        // 이미지 로딩 실패 시 자동 재시도
        setTimeout(loadQuiz, 500);
      };

      const shuffledOptions = [...pokemons].sort(() => Math.random() - 0.5);
      const optionsContainer = document.getElementById('options');
      
      shuffledOptions.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = p.name;
        btn.onclick = () => checkAnswer(p.name);
        optionsContainer.appendChild(btn);
      });

    } catch (err) {
      // 통신 실패 시 재시도
      document.getElementById('loading').innerText = "다시 시도 중...";
      setTimeout(loadQuiz, 1000);
    }
  }

  function checkAnswer(selectedName) {
    stopTimer();
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    const msgElem = document.getElementById('message');

    if (selectedName === currentAnswer) {
      score += 10;
      document.getElementById('score').innerText = score;
      msgElem.style.color = '#2e7d32';
      msgElem.innerText = "정답입니다! 🎉";
      
      playCheerSound();
      speakText("정답입니다!", () => {
        setTimeout(loadQuiz, 1000);
      });
    } else {
      msgElem.style.color = '#c62828';
      msgElem.innerText = `틀렸습니다! (정답: ${currentAnswer})`;
      
      speakText(`아쉬워요! 정답은 ${currentAnswer}입니다.`);
      document.getElementById('next-btn').style.display = 'block';
    }
  }

  function handleTimeout() {
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    const msgElem = document.getElementById('message');
    msgElem.style.color = '#c62828';
    msgElem.innerText = `시간 초과! (정답: ${currentAnswer})`;

    speakText(`시간이 초과되었습니다. 정답은 ${currentAnswer}입니다.`);
    document.getElementById('next-btn').style.display = 'block';
  }

  // 사용자 첫 클릭 시 오디오 엔진 활성화
  document.addEventListener('touchstart', function initAudio() {
    getAudioContext();
    document.removeEventListener('touchstart', initAudio);
  }, { once: true });

  document.addEventListener('click', function initAudio() {
    getAudioContext();
    document.removeEventListener('click', initAudio);
  }, { once: true });

  loadQuiz();
</script>
</body>
</html>
