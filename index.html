<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 이름 맞추기 퀴즈</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    .score-board { font-size: 1.2rem; font-weight: bold; color: #333; margin-bottom: 16px; }
    .img-box {
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .img-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.opt-btn {
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.opt-btn:active { transform: scale(0.97); background: #f0f0f0; }
    .msg { height: 24px; margin: 16px 0; font-weight: bold; }
    .next-btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background-color: #ff5350;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .loading { font-size: 1.1rem; color: #666; }
  </style>
</head>
<body>

<div class="card">
  <div class="score-board">점수: <span id="score">0</span>점</div>
  
  <div class="img-box">
    <div id="loading" class="loading">포켓몬 불러오는 중...</div>
    <img id="pokemon-img" style="display:none;" alt="포켓몬">
  </div>

  <div class="options-grid" id="options"></div>
  <div class="msg" id="message"></div>
  
  <button class="next-btn" id="next-btn" onclick="loadQuiz()" style="display:none;">다음 문제</button>
</div>

<script>
  let score = 0;
  let currentAnswer = "";

  // 썬&문 전국대도감 기준 포켓몬 수 (1 ~ 802번)
  const MAX_POKEMON_ID = 802;

  async function getPokemonData(id) {
    // 고화질 아트워크 이미지 URL
    const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    
    // 한국어 이름 정보 요청
    const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
    const data = await res.json();
    const nameEntry = data.names.find(n => n.language.name === 'ko');
    
    return {
      id: id,
      name: nameEntry ? nameEntry.name : "알수없음",
      img: imgUrl
    };
  }

  async function loadQuiz() {
    // 화면 초기화
    document.getElementById('loading').style.display = 'block';
    document.getElementById('pokemon-img').style.display = 'none';
    document.getElementById('options').innerHTML = '';
    document.getElementById('message').innerText = '';
    document.getElementById('next-btn').style.display = 'none';

    // 1번부터 802번 사이에서 무작위 4마리 ID 추출
    const randomIds = [];
    while (randomIds.length < 4) {
      const rand = Math.floor(Math.random() * MAX_POKEMON_ID) + 1;
      if (!randomIds.includes(rand)) randomIds.push(rand);
    }

    try {
      // 4마리 데이터 동시에 로딩
      const pokemons = await Promise.all(randomIds.map(id => getPokemonData(id)));
      
      // 첫 번째 포켓몬을 정답으로 설정
      const target = pokemons[0];
      currentAnswer = target.name;

      // 이미지 출력 설정
      const imgElem = document.getElementById('pokemon-img');
      imgElem.src = target.img;
      imgElem.onload = () => {
        document.getElementById('loading').style.display = 'none';
        imgElem.style.display = 'block';
      };

      // 4개 선택지 무작위 섞기
      const shuffledOptions = [...pokemons].sort(() => Math.random() - 0.5);

      // 선택지 버튼 생성
      const optionsContainer = document.getElementById('options');
      shuffledOptions.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = p.name;
        btn.onclick = () => checkAnswer(p.name);
        optionsContainer.appendChild(btn);
      });

    } catch (err) {
      document.getElementById('loading').innerText = "데이터 로딩 실패. 다시 시도해 주세요.";
    }
  }

  function checkAnswer(selectedName) {
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true); // 클릭 중복 방지

    const msgElem = document.getElementById('message');
    if (selectedName === currentAnswer) {
      score += 10;
      document.getElementById('score').innerText = score;
      msgElem.style.color = '#2e7d32';
      msgElem.innerText = "정답입니다! 🎉";
    } else {
      msgElem.style.color = '#c62828';
      msgElem.innerText = `틀렸습니다! (정답: ${currentAnswer})`;
    }

    document.getElementById('next-btn').style.display = 'block';
  }

  // 게임 처음 시작
  loadQuiz();
</script>
</body>
</html>
